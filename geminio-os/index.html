<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11142a">
<title>Geminio OS — Workspace Preview</title>
<style>
:root{--bg:#f5f7fc;--panel:#fff;--ink:#111827;--muted:#64748b;--line:#e5eaf2;--brand:#4f46e5;--blue:#3b82f6;--green:#059669;--amber:#d97706;--red:#dc2626;--shadow:0 12px 35px #1725540d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{min-height:100dvh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#11142a;color:#dce2ff;padding:22px 14px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:2px 9px;font-weight:750;font-size:18px;color:#fff}.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#818cf8,#4f46e5);display:grid;place-items:center;color:white;font-weight:900;box-shadow:0 5px 18px #4f46e566}.workspace{margin:0 5px;padding:11px;border:1px solid #ffffff20;border-radius:12px;background:#ffffff0a;color:#e6e9ff;text-align:left}.workspace small{display:block;color:#9ba4ca}.navgroup{display:grid;gap:5px}.navlabel{padding:0 10px;color:#8790b7;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.nav button{width:100%;display:flex;gap:12px;align-items:center;padding:10px;border:0;border-radius:10px;color:#b9c1e2;background:transparent;text-align:left}.nav button:hover,.nav button.active{background:#ffffff13;color:#fff}.nav .ico{width:19px;text-align:center;font-size:16px}.sidebottom{margin-top:auto;color:#8992b6;font-size:12px;padding:10px}.main{min-width:0}.topbar{height:68px;background:#ffffffd9;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 30px;position:sticky;top:0;z-index:5}.crumb{font-weight:700}.search{margin-left:auto;width:min(340px,40vw);border:1px solid var(--line);border-radius:10px;background:#f8faff;padding:9px 12px;color:var(--muted);text-align:left}.topbtn{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 11px}.avatar{width:34px;height:34px;border-radius:50%;background:#e0e7ff;color:#3730a3;font-weight:800;border:0}.content{max-width:1440px;margin:auto;padding:30px}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{color:var(--brand);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.h1{font-size:27px;letter-spacing:-.04em;margin:4px 0}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 14px;background:#fff;font-weight:650;color:var(--ink)}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.soft{background:#eef2ff;color:#3730a3;border-color:#e0e7ff}.btn.danger{color:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:var(--shadow);min-width:0}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.metric{font-size:26px;font-weight:800;letter-spacing:-.04em;margin-top:8px}.muted{color:var(--muted)}.tiny{font-size:12px}.cardtitle{font-weight:750;margin:0 0 12px}.list{display:grid;gap:10px}.listitem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#ecfdf5;color:#047857;font-size:11px;font-weight:750}.pill.demo{background:#fff7ed;color:#9a3412}.pill.neutral{background:#f1f5f9;color:#475569}.projecticon{width:38px;height:38px;border-radius:11px;background:#eef2ff;color:#4338ca;display:grid;place-items:center;font-weight:850}.project{display:flex;gap:12px;align-items:center}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:#475569}.field input,.field textarea,.field select{width:100%;border:1px solid #dbe2ee;border-radius:10px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #4f46e51a}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:17px;overflow:auto}.tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);white-space:nowrap}.tabs button.active{color:var(--brand);border-bottom:2px solid var(--brand);font-weight:750}.bar{height:8px;border-radius:99px;background:#e9edf5;overflow:hidden}.bar span{display:block;height:100%;background:var(--brand);border-radius:99px}.notice{padding:12px 14px;background:#eef2ff;color:#3730a3;border-radius:11px;margin-bottom:16px}.empty{padding:34px;text-align:center;color:var(--muted)}.mobilebar{display:none}.auth{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,#e0e7ff,transparent 36%),#f7f8fc}.authbox{width:min(440px,100%);background:white;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 80px #17255418}.authbox .brand{color:var(--ink);padding:0 0 22px}.authbox .brand .mark{color:white}.toast{position:fixed;right:20px;bottom:22px;background:#11142a;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:30;max-width:min(380px,90vw)}.overlay{position:fixed;inset:0;background:#0f172a66;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);background:white;border-radius:18px;padding:22px;box-shadow:0 24px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center}.mobiletop{display:none}
@media(max-width:980px){.shell{grid-template-columns:76px 1fr}.sidebar{padding:18px 9px}.brand{justify-content:center;padding:0}.brandname,.workspace,.navlabel,.nav button .navtext,.sidebottom{display:none}.nav button{justify-content:center;padding:12px}.nav button .ico{font-size:19px}.content{padding:22px}.span3{grid-column:span 6}.span4{grid-column:span 6}}
@media(max-width:650px){.shell{display:block;padding-bottom:68px}.sidebar{display:none}.topbar{height:58px;padding:0 14px}.topbar .crumb{font-size:13px}.search{width:auto;flex:1;margin-left:auto}.topbtn{display:none}.content{padding:18px 14px}.pagehead{display:block}.pagehead>.row{margin-top:14px}.h1{font-size:24px}.grid{gap:11px}.span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}.mobilebar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 25px #1725540a}.mobilebar button{border:0;background:none;color:#64748b;font-size:10px;padding:4px 0}.mobilebar button b{display:block;font-size:18px}.mobilebar button.active{color:var(--brand);font-weight:800}.authbox{padding:24px}.hide-mobile{display:none}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><div id="overlay"></div>
<script>
const root=document.getElementById('root');let page='welcome',authed=false,activeTab='Overview',projectName='Atlas Starter',projects=[{name:'Atlas Starter',stack:'React · TypeScript',status:'In progress',icon:'A'},{name:'Edge Voice Lab',stack:'Python · FastAPI',status:'Draft',icon:'E'}],tasks=[{name:'Define project requirements',done:true},{name:'Generate starter structure',done:true},{name:'Review generated changes',done:false},{name:'Run test suite',done:false}];
const nav=[['WORKSPACE',[['home','⌂','Home'],['discover','✧','Discover'],['projects','▦','Projects'],['builder','⚡','AI Builder'],['chat','◌','AI Chat']]],['DEVELOPMENT',[['files','▤','Files'],['tests','✓','Tests & Quality'],['deploy','⇧','Deployments'],['docs','▧','Documentation']]],['ACCOUNT',[['integrations','⌘','Integrations'],['wallet','◈','Wallet & Credits'],['settings','⚙','Settings'],['help','?','Help']]]];
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
function go(p){page=p;render();window.scrollTo(0,0)}
function button(label,action,cls='btn'){return '<button class="'+cls+'" data-action="'+action+'">'+label+'</button>'}
function card(title,body,cls='span6'){return '<section class="card '+cls+'"><h3 class="cardtitle">'+title+'</h3>'+body+'</section>'}
function head(title,sub,actions=''){return '<div class="pagehead"><div><div class="eyebrow">Geminio workspace</div><h1 class="h1">'+title+'</h1><p class="sub">'+sub+'</p></div><div class="row">'+actions+'</div></div>'}
function authScreen(title,subtitle,fields,primary,secondary){return '<main class="auth"><section class="authbox"><div class="brand"><span class="mark">G</span><span>Geminio OS</span></div><h1 class="h1">'+title+'</h1><p class="sub">'+subtitle+'</p>'+fields+'<div class="field"><button class="btn primary" style="width:100%" data-action="auth-submit">'+primary+'</button></div><div class="row" style="justify-content:space-between">'+secondary+'</div><p class="tiny muted" style="margin-top:24px">Preview environment · No real account or payment is created.</p></section></main>'}
function field(label,placeholder,type='text'){return '<div class="field"><label>'+label+'</label><input type="'+type+'" placeholder="'+placeholder+'"></div>'}
function shell(body){let items=nav.map(group=>'<div class="navgroup"><div class="navlabel">'+group[0]+'</div>'+group[1].map(n=>'<button class="'+(page===n[0]?'active':'')+'" data-go="'+n[0]+'"><span class="ico">'+n[1]+'</span><span class="navtext">'+n[2]+'</span></button>').join('')+'</div>').join('');return '<div class="shell"><aside class="sidebar"><div class="brand"><span class="mark">G</span><span class="brandname">Geminio OS</span></div><button class="workspace" data-action="workspace"><b>Personal Workspace⌄</b><small>Free preview plan</small></button><nav class="nav">'+items+'</nav><div class="sidebottom">Geminio OS · Preview build<br>Product experience demo</div></aside><main class="main"><header class="topbar"><div class="crumb">'+(page==='home'?'Overview':page[0].toUpperCase()+page.slice(1))+'</div><button class="search" data-go="search">⌕ &nbsp; Search anything… <span class="hide-mobile"> Ctrl K</span></button><button class="topbtn" data-go="notifications">♧</button><button class="avatar" data-go="settings">EC</button></header><div class="content">'+body+'</div></main><nav class="mobilebar">'+[['home','⌂','Home'],['discover','✧','Discover'],['builder','⚡','Build'],['projects','▦','Projects'],['more','•••','More']].map(n=>'<button class="'+(page===n[0]?'active':'')+'" data-go="'+n[0]+'"><b>'+n[1]+'</b>'+n[2]+'</button>').join('')+'</nav></div>'}
function home(){return head('Good morning. Let’s build something.','Your projects, AI workflows, and development activity in one place.',button('+ New Project','new-project','btn primary')+button('Open AI Builder','builder','btn'))+'<div class="notice">✦ Preview workspace — actions demonstrate the product flow. Connect identity, database, AI providers and billing services before launch.</div><div class="grid">'+card('Projects','<div class="metric">02</div><p class="muted tiny">Across this workspace</p>','span3')+card('AI credits','<div class="metric">1,250</div><p class="muted tiny">Preview balance · not real currency</p>','span3')+card('Build activity','<div class="metric">04</div><p class="muted tiny">Tasks in current workflow</p>','span3')+card('Connected services','<div class="metric">0 / 4</div><p class="muted tiny">Configure providers to enable live operations</p>','span3')+card('Continue building','<div class="project"><div class="projecticon">A</div><div><b>'+projectName+'</b><div class="tiny muted">React · TypeScript · Updated just now</div></div></div><div class="row" style="margin-top:18px">'+button('Open project','project','btn soft')+button('Build with AI','builder')+'</div>','span7')+card('Your next steps','<div class="list">'+tasks.map(t=>'<div class="listitem"><span>'+(t.done?'✓':'○')+' &nbsp;'+t.name+'</span><span class="tiny muted">'+(t.done?'Done':'Pending')+'</span></div>').join('')+'</div>','span5')+card('Recent projects','<div class="list">'+projects.map(p=>'<div class="listitem"><div class="project"><div class="projecticon">'+p.icon+'</div><div><b>'+p.name+'</b><div class="tiny muted">'+p.stack+'</div></div></div><span class="pill neutral">'+p.status+'</span></div>').join('')+'</div>'+button('View all projects','projects','btn soft'),'span6')+card('Explore Geminio','<p class="muted">Start from a template, ask the AI assistant, or connect a development tool.</p><div class="row">'+button('Discover templates','discover','btn soft')+button('Open AI chat','chat')+'</div>','span6')+'</div>'}
function projectsPage(){return head('Projects','Create, organize, and continue your software work.',button('+ Create project','new-project','btn primary'))+'<div class="grid">'+projects.map((p,i)=>card('<div class="project"><div class="projecticon">'+p.icon+'</div><div>'+p.name+'<div class="tiny muted">'+p.stack+'</div></div></div>','<p class="muted tiny">Status: '+p.status+'</p><div class="row">'+button('Open','project','btn soft')+button('More','project-menu')+'</div>','span4')).join('')+'</div>'}
function builder(){return head('AI Builder','Turn a clear project goal into a reviewable development plan.', '<span class="pill demo">Preview mode</span>')+'<div class="grid">'+card('1. Describe your goal','<div class="field"><label>What do you want to build?</label><textarea rows="5" id="goal" placeholder="Example: Build a secure team task management app with projects, roles and activity history."></textarea></div><div class="field"><label>Preferred stack</label><select id="stack"><option>React + TypeScript + Node.js</option><option>Expo + React Native</option><option>Python + FastAPI</option></select></div>'+button('Generate plan','plan','btn primary'),'span7')+card('Build settings','<div class="list"><div class="listitem">Workspace <b>Personal</b></div><div class="listitem">Execution <b>Approval required</b></div><div class="listitem">Deployment <b>Manual approval</b></div><div class="listitem">Provider <span class="pill neutral">Not connected</span></div></div><p class="tiny muted">A real build requires server-side provider credentials, budget controls and isolated execution.</p>','span5')+'</div><div id="plan-result"></div>'}
function generic(p){const data={discover:['Discover','Explore templates and workflows to accelerate your next project.',['SaaS starter','API service starter','Mobile app starter','Documentation site']],chat:['AI Chat','Ask questions, reason through architecture, and work with project context.',['New conversation','Project architecture review','Explain a codebase']],files:['Files','Browse project files and uploaded assets.',['src/','docs/','README.md','package.json']],tests:['Tests & Quality','Review quality checks tied to a project revision.',['Unit tests','Type check','Lint','Accessibility']],deploy:['Deployments','Manage environments, releases, logs and rollback approvals.',['Development','Staging','Production']],docs:['Documentation','Create and review project documentation.',['README','API reference','Architecture','Deployment guide']],integrations:['Integrations','Connect providers using secure server-side authorization.',['GitHub','OpenAI','Google Gemini','Paystack']],wallet:['Wallet & Credits','Review usage and credit transactions.',['Available credits','Usage history','Add credits']],settings:['Settings','Manage your profile, preferences and security.',['Profile','Appearance','Notifications','Security']],help:['Help & Support','Find guidance and send feedback.',['Getting started','Documentation','Contact support']],notifications:['Notifications','Build, account and workspace updates.',['No new notifications']],search:['Search','Search within the current workspace.',['Projects','Files','Documentation']],more:['More','Choose another workspace destination.',['AI Chat','Files','Deployments','Integrations','Wallet & Credits','Settings','Help']],project:['Atlas Starter','Project overview and current development activity.',['Overview','Files','AI Builder','Activity','Tests','Deployments','Documentation']]};let d=data[p]||data.home;return head(d[0],d[1],button('Home','home','btn'))+'<div class="grid">'+card('Workspace resources','<div class="list">'+d[2].map(x=>'<div class="listitem"><span>'+x+'</span>'+button('Open','resource','btn soft')+'</div>').join('')+'</div>','span7')+card('Quick actions','<div class="list">'+button('Create project','new-project','btn primary')+button('Open AI Builder','builder')+button('Go to Home','home')+'</div>','span5')+'</div>'}
function createProject(){return head('Create a project','Start with a clear name and choose a stack.')+'<div class="card" style="max-width:680px"><div class="field"><label>Project name</label><input id="project-name" placeholder="My next project"></div><div class="field"><label>Description</label><textarea id="project-desc" rows="3" placeholder="What are you building?"></textarea></div><div class="field"><label>Technology stack</label><select id="project-stack"><option>React · TypeScript</option><option>Expo · React Native</option><option>Python · FastAPI</option></select></div><div class="row">'+button('Create draft','create-project','btn primary')+button('Cancel','projects')+'</div></div>'}
function projectPage(){return head(projectName,'Project workspace · Draft',button('Build with AI','builder','btn primary'))+'<div class="tabs">'+['Overview','Files','AI Builder','Activity','Tests','Deployments','Docs','Settings'].map(t=>'<button class="'+(activeTab===t?'active':'')+'" data-tab="'+t+'">'+t+'</button>').join('')+'</div><div class="grid">'+card(activeTab+' workspace','<p class="muted">This is the '+activeTab.toLowerCase()+' area for '+projectName+'. Connect the project service to load live records and permissions.</p><div class="row">'+button('Open AI Builder','builder','btn primary')+button('Run tests','tests')+'</div>','span8')+card('Project status','<div class="list"><div class="listitem">Lifecycle <b>Draft</b></div><div class="listitem">Last build <b>Not run</b></div><div class="listitem">Deployment <b>Not deployed</b></div></div>','span4')+'</div>'}
function render(){if(!authed&&['welcome','login','signup','forgot','verify'].includes(page)){let sec=page==='welcome'?'<div class="auth"><section class="authbox"><div class="brand"><span class="mark">G</span><span>Geminio OS</span></div><div class="eyebrow">Your AI development workspace</div><h1 class="h1" style="font-size:34px;margin-top:12px">From idea to tested software.</h1><p class="sub">Plan, build, review and ship software with an AI-assisted workflow that keeps you in control.</p><div class="grid" style="margin:22px 0"><div class="card span12">✧ <b>Plan clearly</b><p class="tiny muted">Turn requirements into a structured build plan.</p></div><div class="card span12">⚡ <b>Build with review</b><p class="tiny muted">Inspect generated changes before accepting them.</p></div><div class="card span12">✓ <b>Test before shipping</b><p class="tiny muted">Track quality and deployment approvals.</p></div></div><div class="row">'+button('Create account','signup','btn primary')+button('Sign in','login')+'</div><p class="tiny muted" style="margin-top:20px">Terms · Privacy · Service status</p><p class="tiny muted">Interactive product preview. No real account is created.</p></section></div>':page==='login'?authScreen('Welcome back','Sign in to continue to your workspace.',field('Email','you@example.com','email')+field('Password','Enter password','password'),'Sign in',button('Forgot password','forgot','btn soft')+button('Create account','signup','btn')):page==='signup'?authScreen('Create your account','Start building with Geminio OS.',field('Full name','Your name')+field('Email','you@example.com','email')+field('Password','At least 12 characters','password')+field('Confirm password','Repeat password','password')+'<label class="tiny"><input type="checkbox"> I agree to the Terms and Privacy Policy</label>','Create account',button('Already have an account? Sign in','login','btn soft')):page==='forgot'?authScreen('Reset your password','Enter your email. We will show a generic confirmation.',field('Email','you@example.com','email'),'Send reset link',button('Back to sign in','login','btn soft')):authScreen('Check your email','Use the verification link or code sent to your inbox.',field('Verification code','6-digit code'),'Verify email',button('Back','signup','btn soft'));root.innerHTML=sec;return}
let body=page==='home'?home():page==='projects'?projectsPage():page==='builder'?builder():page==='new-project'?createProject():page==='project'?projectPage():generic(page);root.innerHTML=shell(body)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]'),a=e.target.closest('[data-action]'),tab=e.target.closest('[data-tab]');if(g){go(g.dataset.go);return}if(tab){activeTab=tab.dataset.tab;render();return}if(a){const x=a.dataset.action;if(['auth-submit'].includes(x)){if(page==='login'){authed=true;go('home');toast('Preview session started. Live authentication is not connected.')}else if(page==='signup'){go('verify');toast('Demo: verification service is not connected.')}else toast('Demo action only — connect the identity service.');return}if(x==='new-project'){go('new-project');return}if(x==='plan'){const goal=document.getElementById('goal')?.value.trim();if(!goal){toast('Describe your project goal first.');return}document.getElementById('plan-result').innerHTML='<section class="card" style="margin-top:16px"><h3 class="cardtitle">Proposed plan · Preview</h3><div class="list">'+['Clarify requirements and acceptance criteria','Create application architecture and data model','Generate starter files in an isolated workspace','Run checks and prepare a reviewable diff','Request approval before deployment'].map((t,i)=>'<div class="listitem"><span>'+(i+1)+'. '+t+'</span><span class="pill neutral">Proposed</span></div>').join('')+'</div><p class="tiny muted">This is a local preview plan, not an AI provider response or executed job.</p>'+button('Approve preview plan','approve-plan','btn primary')+'</section>';toast('Preview plan created.');return}if(x==='approve-plan'){toast('Approval recorded in this browser preview only.');return}if(x==='create-project'){let n=document.getElementById('project-name')?.value.trim();if(!n){toast('Enter a project name.');return}projectName=n;projects.unshift({name:n,stack:document.getElementById('project-stack').value,status:'Draft',icon:n[0].toUpperCase()});go('project');toast('Draft project created locally.');return}if(x==='workspace'){toast('Workspace switcher preview.');return}if(x==='resource'||x==='project-menu'){toast('This action needs a connected project service.');return}}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();go('search')}if(e.key==='Escape'){document.getElementById('overlay').innerHTML=''}});
render();
</script>
</body></html>
